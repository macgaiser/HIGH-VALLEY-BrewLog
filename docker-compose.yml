services:
  brewlog:
    # Vorgefertigtes Image von GitHub (wird bei jedem Merge nach main neu
    # gebaut, siehe .github/workflows/docker-publish.yml). Für lokales
    # Entwickeln direkt aus dem Code kann "image:" durch "build: ." ersetzt
    # bzw. ergänzt und mit "docker compose up -d --build" gestartet werden.
    # Version per BREWLOG_VERSION in der .env waehlbar (z.B. v0.1.0-beta, siehe
    # Releases auf GitHub); ohne Angabe der jeweils neueste Stand (latest).
    image: ghcr.io/macgaiser/highvalley-brewlog:${BREWLOG_VERSION:-latest}
    container_name: highvalley-brewlog
    restart: unless-stopped
    ports:
      - "5050:5000"
    volumes:
      - ./data:/data
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
    # Nur relevant, wenn zusaetzlich docker-compose.watchtower.yml genutzt wird.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
