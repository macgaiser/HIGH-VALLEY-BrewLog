name: Docker-Image bauen und veröffentlichen

# Baut bei jedem Push auf main (also nach jedem gemergten Pull Request) sowie
# bei jedem Versions-Tag (z.B. "v1.0.0") ein neues Container-Image und lädt
# es zu GitHub Container Registry (ghcr.io) hoch. Watchtower auf der NAS
# holt sich dieses neue Image dann automatisch (siehe docker-compose.yml).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # Muss kleingeschrieben sein (GHCR-Vorgabe) - deshalb fest eingetragen
  # statt aus github.repository abgeleitet (Repo-Name hat Großbuchstaben).
  IMAGE_NAME: ghcr.io/macgaiser/highvalley-brewlog

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          # Ohne vollen Verlauf/Tags (Standard ist ein flacher Checkout ohne
          # Tags) findet "git describe" unten kein Versions-Tag, selbst wenn
          # der gebaute Commit eins traegt.
          fetch-depth: 0

      - name: Versionsangabe fuer die Fusszeile ermitteln
        id: version
        # Zeigt der gebaute Commit exakt auf ein "v*"-Tag (z.B. weil dieser
        # Workflow-Lauf durch das Pushen von v1.0.0 ausgeloest wurde), wird
        # dieses Tag als Version verwendet - sonst wie bisher die volle
        # Commit-SHA (Fallback bei jedem normalen Merge nach main).
        run: |
          VERSION=$(git describe --tags --exact-match --match "v*" 2>/dev/null || echo "${{ github.sha }}")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION_REF=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
