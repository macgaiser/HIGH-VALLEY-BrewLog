name: Tests

# Läuft bei jedem Pull Request und bei jedem Push auf main: prüft die Berechnungen
# und einen Rauchtest durch die echte App (siehe tests/) sowie einfache Lint-Regeln.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (Syntaxfehler, ungenutzte Importe/Variablen)
        run: ruff check app tests scripts run.py --select E9,F
      - name: Tests
        run: pytest
